# skwd-wall renders this into ~/.cache/skwd-wall-v2/ghostty.conf on every
# wallpaper change; terminal.nix includes it with config-file.
# No background-opacity here, so terminal.nix keeps its own.

foreground = {{colors.on_surface.default.hex}}
background = {{colors.surface.default.hex}}
selection-foreground = {{colors.on_primary.default.hex}}
selection-background = {{colors.primary.default.hex}}
cursor-color = {{colors.primary.default.hex}}
cursor-text = {{colors.on_primary.default.hex}}

# ANSI slots use skwd's terminal colours (real red/green/blue tinted to
# the wallpaper), so ls, git and diffs keep their meaning.
palette = 0={{colors.surface_container_high.default.hex}}
palette = 1={{colors.ansi_red.default.hex}}
palette = 2={{colors.ansi_green.default.hex}}
palette = 3={{colors.ansi_yellow.default.hex}}
palette = 4={{colors.ansi_blue.default.hex}}
palette = 5={{colors.ansi_magenta.default.hex}}
palette = 6={{colors.ansi_cyan.default.hex}}
palette = 7={{colors.on_surface_variant.default.hex}}

palette = 8={{colors.outline.default.hex}}
palette = 9={{colors.ansi_red_bright.default.hex}}
palette = 10={{colors.ansi_green_bright.default.hex}}
palette = 11={{colors.ansi_yellow_bright.default.hex}}
palette = 12={{colors.ansi_blue_bright.default.hex}}
palette = 13={{colors.ansi_magenta_bright.default.hex}}
palette = 14={{colors.ansi_cyan_bright.default.hex}}
palette = 15={{colors.on_surface.default.hex}}
